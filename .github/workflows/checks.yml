name: Application checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:packaging
      - run: npm run test:benchmark-cleanup
  browser:
    name: ${{ matrix.browser == 'chromium' && 'browser' || matrix.browser }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    env:
      XOBJECT_TEST_BROWSER: ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Use Ubuntu archive for browser dependencies
        # The hosted runner's Azure mirror repeatedly stalled during font downloads.
        run: sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:browser
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: application-browser-failure-${{ matrix.browser }}
          path: .local/browser-acceptance/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore
  container:
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: docker compose version
      - run: docker build --tag xobject:local-acceptance .
      - run: node scripts/test-selfhost.mjs
      - run: node scripts/test-selfhost-proxy.mjs
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/docs/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: XOBJECT_DOCS_VERSION=0.0.0-unreleased npm run build
