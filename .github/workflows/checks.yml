name: Application checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:packaging
      - run: npm run test:benchmark-cleanup
  browser:
    name: ${{ matrix.browser == 'chromium' && 'browser' || matrix.browser }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    env:
      XOBJECT_TEST_BROWSER: ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Hosted LTS runners already provide browser libraries; launch/tests verify them.
      - run: npx playwright install ${{ matrix.browser }}
        timeout-minutes: 4
      - run: npm run test:browser
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: application-browser-failure-${{ matrix.browser }}
          path: .local/browser-acceptance/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore
  container:
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: docker compose version
      - run: docker build --tag xobject:local-acceptance .
      - run: node scripts/test-selfhost.mjs
      - run: node scripts/test-selfhost-proxy.mjs
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/docs/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: XOBJECT_DOCS_VERSION=0.0.0-unreleased npm run build
  artifact-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare representative release digest files
        run: |
          mkdir artifact-probe
          printf 'sha256:%064d\n' 1 > artifact-probe/amd64.txt
          printf 'sha256:%064d\n' 2 > artifact-probe/arm64.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifact-probe-amd64-${{ github.run_attempt }}
          path: artifact-probe/amd64.txt
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifact-probe-arm64-${{ github.run_attempt }}
          path: artifact-probe/arm64.txt
          if-no-files-found: error
          retention-days: 1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifact-probe-*-${{ github.run_attempt }}
          path: downloaded-probe
          merge-multiple: true
      - name: Verify merged paths and exact contents
        run: |
          test "$(find downloaded-probe -type f | wc -l)" -eq 2
          cmp artifact-probe/amd64.txt downloaded-probe/amd64.txt
          cmp artifact-probe/arm64.txt downloaded-probe/arm64.txt
