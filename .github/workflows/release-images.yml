name: Release images
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-images
  cancel-in-progress: false
jobs:
  image:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build and accept the native release image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          image="ghcr.io/itextremede/xobject:${version}-${ARCH}"
          echo "RELEASE_IMAGE=$image" >> "$GITHUB_ENV"
          docker build --build-arg "RELEASE_VERSION=$version" --build-arg "VCS_REF=$GITHUB_SHA" --tag "$image" .
          XOBJECT_TEST_IMAGE="$image" node scripts/test-selfhost.mjs
          XOBJECT_TEST_IMAGE="$image" XOBJECT_TEST_PREDECESSOR_IMAGE=ghcr.io/itextremede/xobject@sha256:61ab0952965383f5d0f923f5ed5c98a90e7b01058c1d1f12ccdaa6a8f77d4f97 node scripts/test-selfhost.mjs
          XOBJECT_TEST_IMAGE="$image" XOBJECT_TEST_PREDECESSOR_IMAGE=ghcr.io/itextremede/xobject@sha256:ebdfa850f68485e24b133cebd9d2e9eb0bc48fa45c939b7d853757099be08c4e node scripts/test-selfhost.mjs
          XOBJECT_TEST_IMAGE="$image" XOBJECT_TEST_PREDECESSOR_IMAGE=ghcr.io/itextremede/xobject@sha256:84732cb65fc9d9a1e0d2cc93d6700d24bfe5f5c29a3839eb8033446ef77db68d node scripts/test-selfhost.mjs
          XOBJECT_TEST_IMAGE="$image" XOBJECT_TEST_PREDECESSOR_IMAGE=ghcr.io/itextremede/xobject@sha256:446d8fcd53478909c4828abfe9f3aede39e2b39f415756ac838aa847e4d0d6b4 node scripts/test-selfhost.mjs
          XOBJECT_TEST_IMAGE="$image" node scripts/test-selfhost-proxy.mjs
      - name: Publish the tested architecture
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker push "$RELEASE_IMAGE"
          mkdir -p image-digests
          docker image inspect "$RELEASE_IMAGE" --format '{{index .RepoDigests 0}}' > "image-digests/${ARCH}.txt"
          docker logout ghcr.io
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-image-${{ matrix.arch }}
          path: image-digests/*.txt
          retention-days: 7
  manifest:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-image-*
          merge-multiple: true
          path: image-digests
      - name: Publish the multi-platform immutable release reference
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          image="ghcr.io/itextremede/xobject:$version"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          if docker buildx imagetools inspect "$image" > existing-manifest.txt 2> existing-manifest-error.txt; then
            echo 'Refusing to overwrite an existing release version.' >&2
            exit 1
          fi
          grep -Eqi 'not found|manifest unknown|name unknown' existing-manifest-error.txt
          docker buildx imagetools create --tag "$image" "$(cat image-digests/amd64.txt)" "$(cat image-digests/arm64.txt)"
          docker buildx imagetools inspect "$image" > image-digests/manifest.txt
          docker logout ghcr.io
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-image-manifest
          path: image-digests/*.txt
          retention-days: 7
